name: Build PDFit Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build
        run: |
          dotnet restore PDFitCompanion.csproj
          dotnet build PDFitCompanion.csproj -c Release --no-restore
          dotnet publish PDFitCompanion.csproj -c Release -o publish/

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFitCompanion
          path: publish/PDFitCompanion.exe
          retention-days: 30
