name: Build PDFit Companion MSI

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Restore and Build
        run: |
          dotnet restore PDFitCompanion.csproj
          dotnet build PDFitCompanion.csproj -c Release --no-restore
          dotnet publish PDFitCompanion.csproj -c Release -o publish/

      - name: Build MSI
        run: wix build -o PDFitCompanion.msi PDFitCompanion.wxs -d PDFitCompanionSourceDir=publish/net8.0-windows

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: PDFitCompanion-Setup
          path: PDFitCompanion.msi
          retention-days: 30
